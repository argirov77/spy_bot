version: "3.9"

services:
  db:
    image: postgres:15
    container_name: spy_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spy
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spy"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./services/api
    container_name: spy_api
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    build: ./services/bot
    container_name: spy_bot
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
