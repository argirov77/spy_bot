version: "3.9"

services:
  db:
    image: postgres:15
    container_name: spy_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spy
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./services/api
    container_name: spy_api
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8000:8000"

  bot:
    build: ./services/bot
    container_name: spy_bot
    env_file:
      - .env
    depends_on:
      - api

volumes:
  pgdata:
